name: Build My Xiaozhi No-IPS Firmware

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    name: Build Xiaozhi ST7789 No-IPS Firmware
    runs-on: ubuntu-latest
    container:
      image: espressif/idf:v5.4
    steps:
      - name: Configure safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Append configs to sdkconfig.defaults
        shell: bash
        run: |
          cat << 'EOF' >> sdkconfig.defaults
          CONFIG_BOARD_TYPE_BREAD_COMPACT_WIFI_LCD=y
          CONFIG_ESPTOOLPY_FLASHSIZE_16MB=y
          CONFIG_PARTITION_TABLE_CUSTOM_FILENAME="partitions/v2/16m.csv"
          CONFIG_SPIRAM_MODE_OCT=y
          CONFIG_LCD_ST7789_240X320_NO_IPS=y
          EOF
          echo "=== Updated sdkconfig.defaults ==="
          tail -n 10 sdkconfig.defaults

      - name: Build with ESP-IDF
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Merge app binaries with esptool
        shell: bash
        run: |
          . $IDF_PATH/export.sh
          esptool.py --chip esp32s3 merge_bin -o xiaozhi-no-ips-app.bin --flash_mode keep --flash_freq keep --flash_size 16MB \
            0x0 build/bootloader/bootloader.bin \
            0x8000 build/partition_table/partition-table.bin \
            0xd000 build/ota_data_initial.bin \
            0x20000 build/xiaozhi.bin
          ls -lh xiaozhi-no-ips-app.bin

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-no-ips-app
          path: xiaozhi-no-ips-app.bin
